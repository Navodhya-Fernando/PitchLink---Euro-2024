{% extends base %}

{% block postamble %}
<style>
  html, body { 
    background: radial-gradient(circle at top right, #001f11, #080808) !important;
    margin: 0; padding: 0; 
    width: 100vw; height: 100vh; 
    overflow: hidden;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    color: #cbd5e1;
  }
  .bk-root { 
    width: 100% !important; 
    height: 100% !important; 
    display: flex;
    flex-direction: column;
  }
  
  /* Prevent Tooltip Overlap - Critical Fix */
  .bk-tooltip {
    pointer-events: none !important;
    z-index: 9999 !important;
    opacity: 1 !important;
  }
  
  /* Style Slider Labels - Live Green Theme */
  .bk-slider-title, .bk-input-group label {
    color: #38bdf8 !important; /* Premium cyan instead of neon green */
    font-weight: 700 !important;
    text-transform: uppercase !important;
    font-size: 12px !important;
    letter-spacing: 1px !important;
    margin-bottom: 6px !important;
  }
  
  /* Modern Widget Styling */
  .bk-input { 
    background: rgba(30, 41, 59, 0.7) !important;
    backdrop-filter: blur(8px) !important;
    color: #f8fafc !important; 
    border: 1px solid rgba(56, 189, 248, 0.3) !important; 
    border-radius: 8px !important; 
    padding: 10px 12px !important;
    font-size: 14px !important;
    transition: all 0.3s ease !important;
  }
  
  .bk-input:focus {
    border-color: #38bdf8 !important;
    box-shadow: 0 0 10px rgba(56, 189, 248, 0.3) !important;
    outline: none !important;
  }
  
  /* DataTable Styling - Dark Theme */
  .bk-data-table { 
    background: rgba(15, 23, 42, 0.6) !important;
    backdrop-filter: blur(10px) !important;
    border: 1px solid rgba(255, 255, 255, 0.05) !important;
    border-radius: 10px !important;
    overflow: hidden !important;
  }
  
  .slick-header-column { 
    background: rgba(30, 41, 59, 0.9) !important; 
    color: #38bdf8 !important; 
    font-weight: 800 !important; 
    text-transform: uppercase !important;
    font-size: 11px !important;
    letter-spacing: 1px !important;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1) !important;
  }
  
  .slick-cell { 
    background: transparent !important; 
    color: #e2e8f0 !important; 
    border-bottom: 1px solid rgba(255, 255, 255, 0.03) !important;
    border-right: none !important;
    font-size: 13px !important;
    padding: 8px !important;
    transition: background 0.2s ease !important;
  }
  
  .slick-row:hover .slick-cell {
    background: rgba(56, 189, 248, 0.1) !important;
    color: #fff !important;
  }
  
  /* Custom Scrollbar for a polished look */
  ::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }
  ::-webkit-scrollbar-track {
    background: rgba(0, 0, 0, 0.2); 
  }
  ::-webkit-scrollbar-thumb {
    background: rgba(56, 189, 248, 0.3); 
    border-radius: 10px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: rgba(56, 189, 248, 0.6); 
  }
  
  /* Canvas Cursor */
  canvas { 
    cursor: crosshair !important; 
  }
</style>
{% endblock %}

{% block contents %}
  {{ embed(roots.app_root) }}
{% endblock %}
